<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient background glow spheres -->
  <circle cx="1000" cy="120" r="280" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="500" r="240" fill="#0284c7" opacity="0.18" filter="url(#glow)" />
  <circle cx="650" cy="350" r="200" fill="#a855f7" opacity="0.10" filter="url(#glow)" />

  <!-- Decorative Border Grid -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7" />

  <!-- Monogram Logo Badge -->
  <g transform="translate(80, 75)">
    <rect width="64" height="64" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="url(#textGrad)">KS</text>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(160, 92)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="34" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="1">FULL-STACK &amp; AI SYSTEMS</text>
  </g>

  <!-- Main Headline Name -->
  <text x="80" y="225" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Khandeshwar Suryavanshi
  </text>

  <!-- Tagline -->
  <text x="80" y="280" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="url(#textGrad)">
    Software Engineer • AI Tools &amp; Browser Systems • Production Web Platforms
  </text>

  <!-- Description paragraph -->
  <text x="80" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" line-height="1.5">
    Author of ScrollGuard (AI Wellbeing Platform) &amp; builder of high-converting commercial
  </text>
  <text x="80" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">
    client systems. B.Sc. Computer Science @ Vartak College, University of Mumbai.
  </text>

  <!-- Feature Cards Container -->
  <g transform="translate(80, 415)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="320" height="95" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">ScrollGuard AI</text>
    <text x="24" y="66" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Chrome MV3 • Behavioral Engine</text>

    <!-- Card 2 -->
    <rect x="345" y="0" width="340" height="95" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#a855f7">Client Web Platforms</text>
    <text x="24" y="66" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Balaji Earthmovers • Farm Portals</text>

    <!-- Card 3 -->
    <rect x="710" y="0" width="330" height="95" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#34d399">Core Tech Stack</text>
    <text x="24" y="66" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Python • C++ • TypeScript • React</text>
  </g>

  <!-- Bottom Brand Bar -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="monospace" font-size="16" fill="#64748b">khandeshwarportfolio.netlify.app</text>
    <text x="820" y="0" font-family="monospace" font-size="16" fill="#64748b">github.com/khandeshwar51</text>
  </g>
</svg>
